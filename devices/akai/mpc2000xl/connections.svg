<text x="25" y="436" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="460" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">LCD: LCD</text>
<text x="25" y="478" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">FUNCTION KEYS: F1, F2, F3, F4, F5, F6</text>
<text x="25" y="496" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">NUMERIC / MODE: 7, 8, 9, 4, 5, 6, 1, 2, 3, 0, Shift, Enter</text>
<text x="25" y="514" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">DATA / CURSOR: Main screen, Open window, Data, Cursor up, Cursor left, Cursor right, Cursor down</text>
<text x="25" y="532" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">NOTE VARIATION: After, Note variation</text>
<text x="25" y="550" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">SEQUENCE / TRANSPORT: Tap tempo / Note repeat, Undo seq, Erase, Step &lt;, Step &gt;, Go to, Bar &lt;&lt;, Bar &gt;&gt;, Rec, Over dub, Stop, Play, Play start</text>
<text x="25" y="568" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">LEVELS: Full level, 16 levels</text>
<text x="25" y="586" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">GAIN / VOLUME: Rec gain, Main volume</text>
<text x="25" y="604" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">SEQUENCE MODE: Next seq, Track mute</text>
<text x="25" y="622" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">PAD BANK: A, B, C, D</text>
<text x="25" y="640" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">PADS: Pad 13, Pad 14, Pad 15, Pad 16, Pad 9, Pad 10, Pad 11, Pad 12, Pad 5, Pad 6, Pad 7, Pad 8, Pad 1, Pad 2, Pad 3, Pad 4</text>
</svg>
