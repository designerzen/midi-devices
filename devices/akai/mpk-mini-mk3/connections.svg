<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 512" role="group" aria-labelledby="akai-mpk-mini-mk3-connections--title" aria-describedby="akai-mpk-mini-mk3-connections--description" data-device="akai-mpk-mini-mk3" data-diagram-style="wireframe" style="background: #fff; color: #000;">
<title id="akai-mpk-mini-mk3-connections--title">Akai MPK mini mk3 connections</title><desc id="akai-mpk-mini-mk3-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}[data-part]:focus-visible{outline:3px solid currentColor}</style>
<text x="30" y="37" fill="currentColor" stroke="none" font-size="20" text-anchor="start" font-weight="bold">Akai MPK mini mk3 / CONNECTIONS</text>
<text x="30" y="63" fill="currentColor" stroke="none" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
<rect x="25" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="43" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">INPUTS</text>
<g id="akai-mpk-mini-mk3-connections--port-0-1" aria-label="Sustain" data-direction="input"><title>Sustain</title>
<circle cx="56" cy="155" r="11" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="56" cy="155" r="4" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="87" y="156" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">Sustain</text>
<text x="87" y="177" fill="currentColor" stroke="none" font-size="10" text-anchor="start">6.35 mm pedal / Rear</text>
<text x="473" y="156" fill="currentColor" stroke="none" font-size="8" text-anchor="end">IN &gt;</text>
</g>
<rect x="520" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="538" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">OUTPUTS</text>
<text x="538" y="155" fill="currentColor" stroke="none" font-size="12" text-anchor="start">No connections in this category</text>
<rect x="1015" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1033" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">DATA / POWER / CONTROLS</text>
<g id="akai-mpk-mini-mk3-connections--port-2-1" aria-label="USB-B" data-direction="bidirectional"><title>USB-B</title>
<rect x="1031" y="145" width="30" height="20" rx="3" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1077" y="156" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">USB-B</text>
<text x="1077" y="177" fill="currentColor" stroke="none" font-size="10" text-anchor="start">USB / Rear</text>
<text x="1463" y="156" fill="currentColor" stroke="none" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<text x="25" y="388" fill="currentColor" stroke="none" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="412" fill="currentColor" stroke="none" font-size="11" text-anchor="start">PERFORMANCE: Joystick, Octave -, Octave +, Arp on/off, Tap tempo, Full level, Note repeat</text>
<text x="25" y="430" fill="currentColor" stroke="none" font-size="11" text-anchor="start">PADS: Pad 1, Pad 2, Pad 3, Pad 4, Pad 5, Pad 6, Pad 7, Pad 8</text>
<text x="25" y="448" fill="currentColor" stroke="none" font-size="11" text-anchor="start">KNOBS: Knob 1, Knob 2, Knob 3, Knob 4, Knob 5, Knob 6, Knob 7, Knob 8</text>
<text x="25" y="466" fill="currentColor" stroke="none" font-size="11" text-anchor="start">PROGRAM: Prog select, CC, Prog change, Bank A/B</text>
