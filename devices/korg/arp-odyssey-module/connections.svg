<text x="25" y="684" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="708" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">VCO-1: Frequency coarse, Frequency fine, Audio KYBD on / LF KYBD off, FM depth (pink), FM depth (yellow), Pulse width, Pulse width mod, FM source LFO, FM source S/H / ADSR, PWM source LFO / ADSR</text>
<text x="25" y="726" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">VCO-2: Frequency coarse, Frequency fine, Sync, FM depth (pink), FM depth (yellow), Pulse width, Pulse width mod, FM source LFO / S/H mixer or pedal, FM source S/H / ADSR, PWM source LFO / ADSR</text>
<text x="25" y="744" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">LFO / Sample and hold: LFO freq, S/H input level (blue), S/H input level (white), S/H output lag, S/H input source VCO-1, S/H input source noise / VCO-2, S/H trigger LFO / KYBD</text>
<text x="25" y="762" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Audio mixer: Noise / Ring mod, VCO-1, VCO-2, Noise / Ring mod source, VCO-1 wave, VCO-2 wave</text>
<text x="25" y="780" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">VCF / HPF: VCF freq, Resonance, VCF type, Mod level (black), Mod level (yellow), Mod level (pink), Mod source KYBD CV / S/H mixer or pedal, Mod source S/H / LFO, Mod source ADSR / AR, HPF cutoff freq</text>
<text x="25" y="798" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">VCA: VCA gain, VCA level, Drive, VCA EG AR / ADSR</text>
<text x="25" y="816" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Envelope generators: AR attack, AR release, ADSR attack, ADSR decay, ADSR sustain, ADSR release, ADSR trigger KYBD gate / LFO repeat, ADSR repeat KYBD / auto, AR trigger KYBD gate / LFO repeat</text>
<text x="25" y="834" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Noise / Portamento: Noise generator white / pink, Portamento</text>
<text x="25" y="852" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Rear panel controls: Power, Headphone volume, Mode switch 1-5</text>
</svg>
