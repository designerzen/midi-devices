<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 566" role="group" aria-labelledby="korg-volca-fm2-connections--title" aria-describedby="korg-volca-fm2-connections--description" data-device="korg-volca-fm2" data-diagram-style="wireframe" style="background: #fff; color: #000;">
<title id="korg-volca-fm2-connections--title">Korg volca fm2 connections</title><desc id="korg-volca-fm2-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}[data-part]:focus-visible{outline:3px solid currentColor}</style>
<text x="30" y="37" fill="currentColor" stroke="none" font-size="20" text-anchor="start" font-weight="bold">Korg volca fm2 / CONNECTIONS</text>
<text x="30" y="63" fill="currentColor" stroke="none" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
<rect x="25" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="43" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">INPUTS</text>
<g id="korg-volca-fm2-connections--port-0-1" aria-label="DC 9V" data-direction="input"><title>DC 9V</title>
<circle cx="56" cy="155" r="11" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="56" cy="155" r="4" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="87" y="156" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">DC 9V</text>
<text x="87" y="177" fill="currentColor" stroke="none" font-size="10" text-anchor="start">Power / Top</text>
<text x="473" y="156" fill="currentColor" stroke="none" font-size="8" text-anchor="end">IN &gt;</text>
</g>
