<text x="87" y="239" fill="currentColor" stroke="none" font-size="10" text-anchor="start">3.5 mm TRS / Top</text>
<text x="473" y="218" fill="currentColor" stroke="none" font-size="8" text-anchor="end">IN &gt;</text>
</g>
