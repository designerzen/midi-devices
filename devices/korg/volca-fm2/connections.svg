<text x="25" y="388" fill="currentColor" stroke="none" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="412" fill="currentColor" stroke="none" font-size="11" text-anchor="start">TOP CONNECTIONS: DC 9V, MIDI IN, Sync IN, Sync OUT, Headphones, MIDI OUT</text>
<text x="25" y="430" fill="currentColor" stroke="none" font-size="11" text-anchor="start">MASTER: Volume, Tempo, Program, Memory, Play, Record, Function, Edit, Chorus</text>
<text x="25" y="448" fill="currentColor" stroke="none" font-size="11" text-anchor="start">PERFORMANCE: Transpose, Velocity</text>
<text x="25" y="466" fill="currentColor" stroke="none" font-size="11" text-anchor="start">MODULATOR: Attack, Decay</text>
<text x="25" y="484" fill="currentColor" stroke="none" font-size="11" text-anchor="start">CARRIER: Attack, Decay</text>
<text x="25" y="502" fill="currentColor" stroke="none" font-size="11" text-anchor="start">LFO: Rate, Pitch depth</text>
<text x="25" y="520" fill="currentColor" stroke="none" font-size="11" text-anchor="start">ALGORITHM ARP: Algorithm, Type, Division</text>
</svg>
