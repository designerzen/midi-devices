<text x="473" y="280" fill="currentColor" stroke="none" font-size="8" text-anchor="end">IN &gt;</text>
</g>
<rect x="520" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="538" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">OUTPUTS</text>
