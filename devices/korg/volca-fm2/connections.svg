<rect x="1015" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1033" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">DATA / POWER / CONTROLS</text>
<g id="korg-volca-fm2-connections--port-2-1" aria-label="Power on/off" data-direction="control"><title>Power on/off</title>
<circle cx="1046" cy="155" r="11" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="1046" cy="155" r="4" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1077" y="156" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">Power on/off</text>
<text x="1077" y="177" fill="currentColor" stroke="none" font-size="10" text-anchor="start">Switch / Top</text>
<text x="1463" y="156" fill="currentColor" stroke="none" font-size="8" text-anchor="end">CONTROL</text>
