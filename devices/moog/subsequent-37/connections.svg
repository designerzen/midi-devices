<text x="25" y="664" fill="currentColor" stroke="none" font-size="11" text-anchor="start">ARP / GLIDE: Rate, Range, Pattern, Gate, Glide</text>
<text x="25" y="682" fill="currentColor" stroke="none" font-size="11" text-anchor="start">MOD 1: Rate, Wave, Pitch amt, Filter amt, Mod amt, Source, Dest, Sync</text>
<text x="25" y="700" fill="currentColor" stroke="none" font-size="11" text-anchor="start">OSC 1: Octave, Wave, Frequency, Beat freq, Sync, Duo</text>
