<text x="25" y="808" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">FILTER EG: Attack, Decay, Sustain, Release, Delay, Hold, Vel amt, KB track, Multi trig, Reset, Sync, Loop, Latch</text>
<text x="25" y="826" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">AMP EG: Attack, Decay, Sustain, Release, Delay, Hold, Vel amt, KB track, Multi trig, Reset, Sync, Loop, Latch</text>
