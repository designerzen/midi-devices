<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 746" role="group" aria-labelledby="moog-minitaur-connections--title" aria-describedby="moog-minitaur-connections--description" data-device="moog-minitaur" data-diagram-style="wireframe" style="background: #fff; color: #000;">
<title id="moog-minitaur-connections--title">Moog Minitaur connections</title><desc id="moog-minitaur-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
