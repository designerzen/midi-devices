<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 494" role="img" aria-labelledby="title description">
<title id="title">Arcana Strum connections</title><desc id="description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#000;stroke:none}.line{fill:#fff;stroke:#000;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.thin{fill:none;stroke:#000;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="1500" height="494" class="line" fill="#fff" stroke="none" stroke-width="1.6"/>
<text x="30" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="start" font-weight="bold">Arcana Strum / CONNECTIONS</text>
<text x="30" y="63" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
<rect x="25" y="90" width="470" height="260" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="6"/>
<text x="43" y="116" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">INPUTS</text>
<text x="43" y="155" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start">No connections in this category</text>
<rect x="520" y="90" width="470" height="260" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="6"/>
<text x="538" y="116" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">OUTPUTS</text>
<text x="538" y="155" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start">No connections in this category</text>
<rect x="1015" y="90" width="470" height="260" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="6"/>
<text x="1033" y="116" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">DATA / POWER / CONTROLS</text>
<g id="port-2-1" aria-label="USB power / MIDI" data-direction="bidirectional"><title>USB power / MIDI</title>
<rect x="1031" y="145" width="30" height="20" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
<text x="1077" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">USB power / MIDI</text>
<text x="1077" y="177" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">USB / Edge</text>
<text x="1463" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<g id="port-2-2" aria-label="E-Box" data-direction="bidirectional"><title>E-Box</title>
<circle cx="1046" cy="217" r="11" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<circle cx="1046" cy="217" r="4" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="1077" y="218" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">E-Box</text>
<text x="1077" y="239" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">Accessory connector / Edge</text>
<text x="1463" y="218" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<text x="25" y="388" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="412" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">FIVE-KEY TOUCH CLUSTER: Playing key 1, Playing key 2, Playing key 3, Playing key 4, Playing key 5</text>
<text x="25" y="430" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">MODE BUTTONS: Duration, Melodic mode, SeptaChords, Power / Reset, Transpose -, Transpose +, Mode 1, Mode 2</text>
<text x="25" y="448" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">STRUM STICK: Strum handle</text>
</svg>
