<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 494" role="group" aria-labelledby="arcana-strum-connections--title" aria-describedby="arcana-strum-connections--description" data-device="arcana-strum" data-diagram-style="wireframe" style="background: #fff; color: #000;">
<title id="arcana-strum-connections--title">Arcana Strum connections</title><desc id="arcana-strum-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}[data-part]:focus-visible{outline:3px solid currentColor}</style>
<text x="30" y="37" fill="currentColor" stroke="none" font-size="20" text-anchor="start" font-weight="bold">Arcana Strum / CONNECTIONS</text>
<text x="30" y="63" fill="currentColor" stroke="none" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
<rect x="25" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="43" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">INPUTS</text>
<text x="43" y="155" fill="currentColor" stroke="none" font-size="12" text-anchor="start">No connections in this category</text>
<rect x="520" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="538" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">OUTPUTS</text>
<text x="538" y="155" fill="currentColor" stroke="none" font-size="12" text-anchor="start">No connections in this category</text>
<rect x="1015" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1033" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">DATA / POWER / CONTROLS</text>
<g id="arcana-strum-connections--port-2-1" aria-label="USB power / MIDI" data-direction="bidirectional"><title>USB power / MIDI</title>
<rect x="1031" y="145" width="30" height="20" rx="3" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1077" y="156" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">USB power / MIDI</text>
<text x="1077" y="177" fill="currentColor" stroke="none" font-size="10" text-anchor="start">USB / Edge</text>
<text x="1463" y="156" fill="currentColor" stroke="none" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<g id="arcana-strum-connections--port-2-2" aria-label="E-Box" data-direction="bidirectional"><title>E-Box</title>
<circle cx="1046" cy="217" r="11" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="1046" cy="217" r="4" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1077" y="218" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">E-Box</text>
<text x="1077" y="239" fill="currentColor" stroke="none" font-size="10" text-anchor="start">Accessory connector / Edge</text>
<text x="1463" y="218" fill="currentColor" stroke="none" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<text x="25" y="388" fill="currentColor" stroke="none" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="412" fill="currentColor" stroke="none" font-size="11" text-anchor="start">FIVE-KEY TOUCH CLUSTER: Playing key 1, Playing key 2, Playing key 3, Playing key 4, Playing key 5</text>
<text x="25" y="430" fill="currentColor" stroke="none" font-size="11" text-anchor="start">MODE BUTTONS: Duration, Melodic mode, SeptaChords, Power / Reset, Transpose -, Transpose +, Mode 1, Mode 2</text>
<text x="25" y="448" fill="currentColor" stroke="none" font-size="11" text-anchor="start">STRUM STICK: Strum handle</text>
</svg>
