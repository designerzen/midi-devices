<title id="expressive-e-osmose-connections--title">Expressive E Osmose connections</title><desc id="expressive-e-osmose-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
