<text x="25" y="436" fill="currentColor" stroke="none" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="460" fill="currentColor" stroke="none" font-size="11" text-anchor="start">MACROS: Volume, Macro 1, Macro 2, Macro 3, Macro 4, Macro 5, Macro 6, Macro 7, Macro 8</text>
<text x="25" y="478" fill="currentColor" stroke="none" font-size="11" text-anchor="start">TRACK SELECT: Synth 1, Synth 2, Drum 1, Drum 2, Drum 3, Drum 4</text>
<text x="25" y="496" fill="currentColor" stroke="none" font-size="11" text-anchor="start">GRID: Pad 1, Pad 2, Pad 3, Pad 4, Pad 5, Pad 6, Pad 7, Pad 8, Pad 9, Pad 10, Pad 11, Pad 12, Pad 13, Pad 14, Pad 15, Pad 16, Pad 17, Pad 18, Pad 19, Pad 20, Pad 21, Pad 22, Pad 23, Pad 24, Pad 25, Pad</text>
<text x="25" y="514" fill="currentColor" stroke="none" font-size="11" text-anchor="start">26, Pad 27, Pad 28, Pad 29, Pad 30, Pad 31, Pad 32</text>
<text x="25" y="532" fill="currentColor" stroke="none" font-size="11" text-anchor="start">FUNCTIONS: Note, Velocity, Gate, Nudge, Length, Scale, Shift</text>
<text x="25" y="550" fill="currentColor" stroke="none" font-size="11" text-anchor="start">SESSION: FX, Mixer, Patterns, Sessions, Duplicate, Clear, Save</text>
<text x="25" y="568" fill="currentColor" stroke="none" font-size="11" text-anchor="start">TRANSPORT: Octave -, Octave +, Tempo, Swing, Play, Record</text>
