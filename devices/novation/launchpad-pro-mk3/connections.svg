<text x="25" y="448" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">pad 7, Row 2 pad 8, Row 3 pad 1, Row 3 pad 2, Row 3 pad 3, Row 3 pad 4, Row 3 pad 5, Row 3 pad 6, Row 3 pad 7, Row 3 pad 8, Row 4 pad 1, Row 4 pad 2, Row 4 pad 3, Row 4 pad 4, Row 4 pad 5, Row 4 pad</text>
<text x="25" y="466" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">6, Row 4 pad 7, Row 4 pad 8, Row 5 pad 1, Row 5 pad 2, Row 5 pad 3, Row 5 pad 4, Row 5 pad 5, Row 5 pad 6, Row 5 pad 7, Row 5 pad 8, Row 6 pad 1, Row 6 pad 2, Row 6 pad 3, Row 6 pad 4, Row 6 pad 5,</text>
<text x="25" y="484" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Row 6 pad 6, Row 6 pad 7, Row 6 pad 8, Row 7 pad 1, Row 7 pad 2, Row 7 pad 3, Row 7 pad 4, Row 7 pad 5, Row 7 pad 6, Row 7 pad 7, Row 7 pad 8, Row 8 pad 1, Row 8 pad 2, Row 8 pad 3, Row 8 pad 4, Row 8</text>
<text x="25" y="502" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">pad 5, Row 8 pad 6, Row 8 pad 7, Row 8 pad 8</text>
<text x="25" y="520" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">LEFT CONTROLS: Up, Down, Clear, Duplicate, Quantise, Fixed length, Play, Record</text>
<text x="25" y="538" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">SCENES / SEQUENCE: Scene 1, Scene 2, Scene 3, Scene 4, Scene 5, Scene 6, Scene 7, Scene 8</text>
<text x="25" y="556" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">TRACK SELECT: Track 1, Track 2, Track 3, Track 4, Track 5, Track 6, Track 7, Track 8</text>
<text x="25" y="574" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">TRACK CONTROLS: Record arm, Mute, Solo, Volume, Pan, Sends, Device, Stop clip</text>
<text x="25" y="592" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">SHIFT: Shift</text>
<text x="25" y="610" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">SETUP: Setup</text>
