<text x="1033" y="116" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">DATA / POWER / CONTROLS</text>
<g id="port-2-1" aria-label="Micro USB" data-direction="bidirectional"><title>Micro USB</title>
<svg data-symbol="bidirectional" x="1029.000" y="142.000" width="34.000" height="34.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="34" height="34" fill="url(#tactile-dots)"/></g></svg>
<text x="1077" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">Micro USB</text>
<text x="1077" y="177" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">USB / Rear</text>
<text x="1463" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<text x="25" y="388" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="412" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">PALETTE: Tone A, Tone B, Tone C, Tone D</text>
<text x="25" y="430" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">LFO: Select, Rate, Delay, Fade, Waveform, Offset, Key trigger</text>
<text x="25" y="448" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">WG: Pitch coarse, Pitch fine, Pitch random, Key follow, Waveform, LFO 1, LFO 2</text>
<text x="25" y="466" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">ENVELOPE: Time key follow, T1, T2, T3, T4, L1, L2, L3, L4, Sustain, Select</text>
<text x="25" y="484" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">TVF: Mode, Cutoff, Resonance, Env, Key follow, LFO select, LFO</text>
<text x="25" y="502" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">TVA: Level, Bias direction, Bias point, Bias level, LFO select, LFO</text>
<text x="25" y="520" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">MEMORY / PERFORMANCE: Volume, Tone A, Tone B, Tone C, Tone D, Layer Active, Arpeggio, Note, Common, Effects, Start, Exit, Value, Manual, Bank 1, Bank 2, Bank 3, Bank 4, Bank 5, Bank 6, Bank 7, Bank 8,</text>
<text x="25" y="538" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Number 1, Number 2, Number 3, Number 4, Number 5, Number 6, Number 7, Number 8</text>
