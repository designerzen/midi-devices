<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 584" role="group" aria-labelledby="roland-jd-08-connections--title" aria-describedby="roland-jd-08-connections--description" data-device="roland-jd-08" data-diagram-style="wireframe" style="background: #fff; color: #000;">
<title id="roland-jd-08-connections--title">Roland JD-08 connections</title><desc id="roland-jd-08-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}[data-part]:focus-visible{outline:3px solid currentColor}</style>
<text x="30" y="37" fill="currentColor" stroke="none" font-size="20" text-anchor="start" font-weight="bold">Roland JD-08 / CONNECTIONS</text>
<text x="30" y="63" fill="currentColor" stroke="none" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
