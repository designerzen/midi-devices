<circle cx="60" cy="155" r="1" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<circle cx="64" cy="153" r="1" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="87" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">MIDI IN</text>
<text x="87" y="177" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">DIN 5-pin / Rear</text>
<text x="473" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">IN &gt;</text>
</g>
<rect x="520" y="90" width="470" height="308" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="6"/>
