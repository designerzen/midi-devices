<text x="25" y="436" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="460" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">RIBBONS: C1, C2</text>
<text x="25" y="478" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">MODE / MEMORY: Bank 1, Bank 2, Dec, Inc, Controller, Synth, Seq, Menu, Patch 1, Patch 2, Patch 3, Patch 4, Play / Stop, Write, Function, Shift</text>
<text x="25" y="496" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">DISPLAY: Display</text>
<text x="25" y="514" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">ENCODERS: Encoder 1, Encoder 2, Encoder 3, Encoder 4</text>
</svg>
