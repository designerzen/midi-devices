<text x="87" y="218" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">MIDI IN</text>
<text x="87" y="239" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">DIN 5-pin / Rear</text>
