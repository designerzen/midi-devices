<text x="1033" y="116" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">DATA / POWER / CONTROLS</text>
<g id="port-2-1" aria-label="Micro USB" data-direction="bidirectional"><title>Micro USB</title>
<svg data-symbol="bidirectional" x="1029.000" y="142.000" width="34.000" height="34.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="34" height="34" fill="url(#tactile-dots)"/></g></svg>
<text x="1077" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">Micro USB</text>
<text x="1077" y="177" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">USB / Rear</text>
<text x="1463" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<text x="25" y="388" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="412" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">LFO: Rate, Delay</text>
<text x="25" y="430" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">DCO: 16 foot, 8 foot, 4 foot, LFO, PWM, PWM source, Square, Saw, Sub, Noise</text>
<text x="25" y="448" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">HPF: Cutoff</text>
<text x="25" y="466" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">VCF: Cutoff, Resonance, Polarity, Envelope, LFO, Key follow</text>
<text x="25" y="484" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">VCA: Envelope Gate, Level</text>
<text x="25" y="502" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">ENVELOPE: Attack, Decay, Sustain, Release</text>
<text x="25" y="520" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">CHORUS: Chorus I, Chorus II</text>
<text x="25" y="538" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">KEYBOARD: Hold, Chord, Note</text>
<text x="25" y="556" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">ARPEGGIO: On Off, Mode, Range, Rate</text>
<text x="25" y="574" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">MEMORY / PERFORMANCE: Volume, Sound mode 60 106, Manual, Start, Edit, Value, Note Gate, Bank 1, Bank 2, Bank 3, Bank 4, Patch 1, Patch 2, Patch 3, Patch 4, Patch 5, Patch 6, Patch 7, Patch 8</text>
</svg>
