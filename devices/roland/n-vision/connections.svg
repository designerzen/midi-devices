<text x="25" y="388" fill="currentColor" stroke="none" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="412" fill="currentColor" stroke="none" font-size="11" text-anchor="start">LFO: Amp, Delay, Wave, Rate, Key trigger</text>
<text x="25" y="430" fill="currentColor" stroke="none" font-size="11" text-anchor="start">POSITION: LFO, LFO polarity, Random, Spread, Position, Env, Env polarity</text>
<text x="25" y="448" fill="currentColor" stroke="none" font-size="11" text-anchor="start">OSCILLATOR: Layer 1 wave, Range, Layer 2 wave, Layer 2 octave, Layer mix, Mix env, Mix LFO</text>
<text x="25" y="466" fill="currentColor" stroke="none" font-size="11" text-anchor="start">WAVESHAPER: Pitch LFO, LFO, Shape, Env</text>
<text x="25" y="484" fill="currentColor" stroke="none" font-size="11" text-anchor="start">FILTER: Cutoff, Resonance, Env, LFO, Drive, HPF, Type, Key follow</text>
<text x="25" y="502" fill="currentColor" stroke="none" font-size="11" text-anchor="start">AMP: Level</text>
<text x="25" y="520" fill="currentColor" stroke="none" font-size="11" text-anchor="start">ENVELOPE: Attack, Decay, Sustain, Release, Portamento, Portamento time, ENV select</text>
<text x="25" y="538" fill="currentColor" stroke="none" font-size="11" text-anchor="start">EFFECTS: Delay, Time, Feedback, Reverb, Reverb time</text>
<text x="25" y="556" fill="currentColor" stroke="none" font-size="11" text-anchor="start">MEMORY / PERFORMANCE: Volume, Note, Arpeggio, Sequencer, Start, Menu, Value, Hold, Dual, Split, Lower, Upper, Bank 1 4, Bank 5 8, Manual, Delay Reverb, Chorus I, Chorus II, Patch 1, Patch 2, Patch 3,</text>
<text x="25" y="574" fill="currentColor" stroke="none" font-size="11" text-anchor="start">Patch 4, Patch 5, Patch 6</text>
</svg>
