<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" role="group" aria-labelledby="roland-n-vision-connections--title" aria-describedby="roland-n-vision-connections--description" data-device="roland-n-vision" data-diagram-style="wireframe" style="background: #fff; color: #000;">
<title id="roland-n-vision-connections--title">Roland n/vision connections</title><desc id="roland-n-vision-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}[data-part]:focus-visible{outline:3px solid currentColor}</style>
<text x="30" y="37" fill="currentColor" stroke="none" font-size="20" text-anchor="start" font-weight="bold">Roland n/vision / CONNECTIONS</text>
<text x="30" y="63" fill="currentColor" stroke="none" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
<rect x="25" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="43" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">INPUTS</text>
