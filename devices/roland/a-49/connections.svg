<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 494" role="img" aria-labelledby="title description">
<title id="title">Roland A-49 connections</title><desc id="description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#000;stroke:none}.line{fill:#fff;stroke:#000;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.thin{fill:none;stroke:#000;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="1500" height="494" class="line" fill="#fff" stroke="none" stroke-width="1.6"/>
<text x="30" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="start" font-weight="bold">Roland A-49 / CONNECTIONS</text>
<text x="30" y="63" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
<rect x="25" y="90" width="470" height="260" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="6"/>
<text x="43" y="116" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">INPUTS</text>
<g id="port-0-1" aria-label="Hold" data-direction="input"><title>Hold</title>
<circle cx="56" cy="155" r="11" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<circle cx="56" cy="155" r="4" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="87" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">Hold</text>
<text x="87" y="177" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">6.35 mm pedal / Rear</text>
<text x="473" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">IN &gt;</text>
</g>
<g id="port-0-2" aria-label="Expression" data-direction="input"><title>Expression</title>
<circle cx="56" cy="217" r="11" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<circle cx="56" cy="217" r="4" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="87" y="218" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">Expression</text>
<text x="87" y="239" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">6.35 mm pedal / Rear</text>
<text x="473" y="218" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">IN &gt;</text>
</g>
<rect x="520" y="90" width="470" height="260" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="6"/>
<text x="538" y="116" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">OUTPUTS</text>
<g id="port-1-1" aria-label="MIDI OUT" data-direction="output"><title>MIDI OUT</title>
<circle cx="551" cy="155" r="13" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<circle cx="543" cy="153" r="1" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<circle cx="547" cy="155" r="1" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<circle cx="551" cy="157" r="1" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<circle cx="555" cy="155" r="1" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<circle cx="559" cy="153" r="1" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="582" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">MIDI OUT</text>
<text x="582" y="177" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">DIN 5-pin / Rear</text>
<text x="968" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">&gt; OUT</text>
</g>
<rect x="1015" y="90" width="470" height="260" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="6"/>
<text x="1033" y="116" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">DATA / POWER / CONTROLS</text>
<g id="port-2-1" aria-label="USB-B" data-direction="bidirectional"><title>USB-B</title>
<rect x="1031" y="145" width="30" height="20" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
<text x="1077" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">USB-B</text>
<text x="1077" y="177" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">USB / Rear</text>
<text x="1463" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<text x="25" y="388" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="412" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">D-BEAM: D-BEAM, Pitch, Volume, Assign</text>
<text x="25" y="430" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">CONTROLLERS: C1, C2, Function, SuperNATURAL, Octave -, Octave +, Transpose</text>
<text x="25" y="448" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">PERFORMANCE: Pitch / Mod lever, S1, S2</text>
</svg>
