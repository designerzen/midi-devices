<title id="roland-tr-06-connections--title">Roland TR-06 connections</title><desc id="roland-tr-06-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
