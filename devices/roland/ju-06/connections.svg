<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 602" role="group" aria-labelledby="roland-ju-06-connections--title" aria-describedby="roland-ju-06-connections--description" data-device="roland-ju-06" data-diagram-style="wireframe" style="background: #fff; color: #000;">
<title id="roland-ju-06-connections--title">Roland JU-06 connections</title><desc id="roland-ju-06-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
