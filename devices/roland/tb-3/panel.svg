<rect x="238.583" y="402.368" width="332.834" height="332.834" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="9"/>
<path d="M305.15 568.785L504.85 568.785" fill="none" stroke="#000" stroke-width="1"/>
