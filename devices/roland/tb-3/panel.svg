<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 850" role="img" aria-labelledby="title description">
<title id="title">Roland TB-3 top panel</title><desc id="description">Original simplified top-down line drawing; positions are illustrative, not mechanical dimensions. Labels identify physical controls, not guaranteed MIDI assignments.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#000;stroke:none}.line{fill:#fff;stroke:#000;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.thin{fill:none;stroke:#000;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="1050" height="850" class="line" fill="#fff" stroke="none" stroke-width="1.6"/>
<rect x="9" y="9" width="1032" height="832" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="12"/>
<text x="25" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="bold">Roland TB-3</text>
<text x="1025" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="end">TOP VIEW</text>
<rect x="25" y="65" width="1000" height="145" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
<g id="sound-volume" data-kind="knob" aria-label="Volume"><title>Volume</title>
<circle cx="129.8" cy="141.285" r="25" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<path d="M129.8 119.285L129.8 132.535" fill="none" stroke="#000" stroke-width="1"/>
</g>
<g id="sound-cutoff" data-kind="knob" aria-label="Cutoff" data-control="cutoff"><title>Cutoff</title>
<circle cx="327.4" cy="141.285" r="25" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<path d="M327.4 119.285L327.4 132.535" fill="none" stroke="#000" stroke-width="1"/>
</g>
<g id="sound-resonance" data-kind="knob" aria-label="Resonance" data-control="resonance"><title>Resonance</title>
<circle cx="525" cy="141.285" r="25" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<path d="M525 119.285L525 132.535" fill="none" stroke="#000" stroke-width="1"/>
</g>
<g id="sound-accent" data-kind="knob" aria-label="Accent" data-control="accent"><title>Accent</title>
<circle cx="722.6" cy="141.285" r="25" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<path d="M722.6 119.285L722.6 132.535" fill="none" stroke="#000" stroke-width="1"/>
</g>
<g id="sound-effect" data-kind="knob" aria-label="Effect" data-control="effect"><title>Effect</title>
<circle cx="920.2" cy="141.285" r="25" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<path d="M920.2 119.285L920.2 132.535" fill="none" stroke="#000" stroke-width="1"/>
</g>
<rect x="25" y="225" width="1000" height="100" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
<g id="modes-keyboard" data-kind="button" aria-label="Keyboard"><title>Keyboard</title>
<rect x="114.8" y="263.785" width="30" height="30" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
</g>
<g id="modes-xy-play" data-kind="button" aria-label="XY Play"><title>XY Play</title>
<rect x="312.4" y="263.785" width="30" height="30" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
</g>
<g id="modes-env-mod" data-kind="button" aria-label="Env mod"><title>Env mod</title>
<rect x="510" y="263.785" width="30" height="30" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
