<rect x="811" y="375" width="96.5" height="76.32" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
<rect x="815" y="379" width="88.5" height="68.32" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="1"/>
</g>
<g id="tempo-seq-value" data-kind="knob" aria-label="Value"><title>Value</title>
<circle cx="965.75" cy="413.16" r="25" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
<path d="M965.75 391.16L965.75 404.41" fill="none" stroke="#000" stroke-width="1"/>
</g>
<g id="tempo-seq-tempo" data-kind="button" aria-label="Tempo"><title>Tempo</title>
