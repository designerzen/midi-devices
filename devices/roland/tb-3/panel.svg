</g>
<g id="tempo-seq-start-stop" data-kind="button" aria-label="Start / Stop"><title>Start / Stop</title>
<rect x="950.75" y="501.91" width="30" height="30" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
</g>
<g id="tempo-seq-record" data-kind="button" aria-label="Record"><title>Record</title>
<rect x="844.25" y="605.66" width="30" height="30" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
</g>
<g id="tempo-seq-step-rec" data-kind="button" aria-label="Step rec"><title>Step rec</title>
<rect x="950.75" y="605.66" width="30" height="30" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
</g>
<g id="tempo-seq-realtime-rec" data-kind="button" aria-label="Realtime rec"><title>Realtime rec</title>
<rect x="844.25" y="709.41" width="30" height="30" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
