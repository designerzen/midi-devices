<text x="25" y="388" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="412" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">CONTROLLERS: Ribbon C1, Ribbon C2</text>
<text x="25" y="430" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">PITCH SHIFT: Time, Pitch set, Auto Off Manual</text>
<text x="25" y="448" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">BALANCE: Direct mic, Human voice, Strings</text>
<text x="25" y="466" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">VIBRATO: Rate, Delay, Depth</text>
<text x="25" y="484" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">VOCODER: On Off, Ensemble, Level, Tone</text>
<text x="25" y="502" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">HUMAN VOICE: Male 8 foot, Female 4 foot, Ensemble, Attack</text>
<text x="25" y="520" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">STRINGS: On Off, Attack, Tone, Release</text>
<text x="25" y="538" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">MEMORY / PERFORMANCE: Volume, Tune, Mic power, C1 mode, Memory, Play Stop, Step 1, Step 2, Step 3, Step 4, Step 5, Step 6, Step 7, Step 8, Step 9, Step 10, Step 11, Step 12, Step 13, Step 14, Step 15,</text>
<text x="25" y="556" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Step 16</text>
