<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 640" role="group" aria-labelledby="roland-tb-03-connections--title" aria-describedby="roland-tb-03-connections--description" data-device="roland-tb-03" data-diagram-style="wireframe" style="background: #fff; color: #000;">
<title id="roland-tb-03-connections--title">Roland TB-03 connections</title><desc id="roland-tb-03-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
