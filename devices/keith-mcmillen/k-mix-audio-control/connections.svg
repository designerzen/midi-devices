<text x="87" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">Inputs 1/2</text>
<text x="87" y="177" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">XLR / TRS combo / Rear</text>
<text x="473" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">IN &gt;</text>
</g>
<g id="port-0-2" aria-label="Inputs 3-8" data-direction="input"><title>Inputs 3-8</title>
<circle cx="56" cy="217" r="11" class="line" fill="#fff" stroke="#000" stroke-width="1.6"/>
