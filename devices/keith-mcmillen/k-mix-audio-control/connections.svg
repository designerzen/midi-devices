<text x="25" y="412" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">ROTARY TOUCH: Rotary 1, Rotary 2, Rotary 3, Rotary 4</text>
<text x="25" y="430" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">CHANNEL FADERS: Channel 1, Channel 2, Channel 3, Channel 4, Channel 5, Channel 6, Channel 7, Channel 8</text>
<text x="25" y="448" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">CHANNEL SELECT: 1, 2, 3, 4, 5, 6, 7, 8</text>
<text x="25" y="466" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">MAIN: Main</text>
<text x="25" y="484" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">NAVIGATION: Up, Down, Left, Right</text>
<text x="25" y="502" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">MIX / MIDI: Input, Output, Pan, Aux 1, Aux 2, Aux 3, EQ, Dynamics, Reverb, MIDI, Bank 1, Bank 2, Bank 3, Mute, Solo, Bypass</text>
