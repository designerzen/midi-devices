<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 586" role="group" aria-labelledby="arturia-keystep-connections--title" aria-describedby="arturia-keystep-connections--description" data-device="arturia-keystep" data-diagram-style="wireframe" style="background: #fff; color: #000;">
<title id="arturia-keystep-connections--title">Arturia KeyStep connections</title><desc id="arturia-keystep-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}[data-part]:focus-visible{outline:3px solid currentColor}</style>
<text x="30" y="37" fill="currentColor" stroke="none" font-size="20" text-anchor="start" font-weight="bold">Arturia KeyStep / CONNECTIONS</text>
<text x="30" y="63" fill="currentColor" stroke="none" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
