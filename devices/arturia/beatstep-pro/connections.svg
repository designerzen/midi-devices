</g>
<rect x="1015" y="90" width="470" height="370" fill="#fff" stroke="#000" stroke-width="1.6" rx="6"/>
<text x="1033" y="116" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">DATA / POWER / CONTROLS</text>
<g id="port-2-1" aria-label="USB MIDI / power" data-direction="bidirectional"><title>USB MIDI / power</title>
<svg data-symbol="bidirectional" x="1029.000" y="142.000" width="34.000" height="34.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="34" height="34" fill="url(#tactile-dots)"/></g></svg>
<text x="1077" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">USB MIDI / power</text>
<text x="1077" y="177" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">Micro-USB / Device edge</text>
<text x="1463" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<text x="25" y="498" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="522" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">ENCODERS: Encoder 1, Encoder 2, Encoder 3, Encoder 4, Encoder 5, Encoder 6, Encoder 7, Encoder 8, Encoder 9, Encoder 10, Encoder 11, Encoder 12, Encoder 13, Encoder 14, Encoder 15, Encoder 16</text>
