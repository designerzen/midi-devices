<text x="582" y="363" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">Eight analog gate outputs / Device edge</text>
<text x="968" y="342" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">&gt; OUT</text>
</g>
<g id="port-1-5" aria-label="CLOCK OUT" data-direction="output"><title>CLOCK OUT</title>
<svg data-symbol="output" x="534.000" y="390.000" width="34.000" height="34.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="url(#tactile-stripes)"/></g></svg>
<text x="582" y="404" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">CLOCK OUT</text>
