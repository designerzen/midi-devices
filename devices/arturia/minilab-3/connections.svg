<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 530" role="group" aria-labelledby="arturia-minilab-3-connections--title" aria-describedby="arturia-minilab-3-connections--description" data-device="arturia-minilab-3" data-diagram-style="wireframe" style="background: #fff; color: #000;">
<title id="arturia-minilab-3-connections--title">Arturia MiniLab 3 connections</title><desc id="arturia-minilab-3-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}[data-part]:focus-visible{outline:3px solid currentColor}</style>
<text x="30" y="37" fill="currentColor" stroke="none" font-size="20" text-anchor="start" font-weight="bold">Arturia MiniLab 3 / CONNECTIONS</text>
<text x="30" y="63" fill="currentColor" stroke="none" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
<rect x="25" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="43" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">INPUTS</text>
<g id="arturia-minilab-3-connections--port-0-1" aria-label="Control pedal" data-direction="input"><title>Control pedal</title>
<circle cx="56" cy="155" r="11" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="56" cy="155" r="4" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="87" y="156" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">Control pedal</text>
<text x="87" y="177" fill="currentColor" stroke="none" font-size="10" text-anchor="start">6.35 mm pedal / Rear</text>
<text x="473" y="156" fill="currentColor" stroke="none" font-size="8" text-anchor="end">IN &gt;</text>
</g>
<rect x="520" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="538" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">OUTPUTS</text>
<g id="arturia-minilab-3-connections--port-1-1" aria-label="MIDI OUT" data-direction="output"><title>MIDI OUT</title>
<circle cx="551" cy="155" r="13" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="543" cy="153" r="1" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="547" cy="155" r="1" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="551" cy="157" r="1" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="555" cy="155" r="1" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="559" cy="153" r="1" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="582" y="156" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">MIDI OUT</text>
<text x="582" y="177" fill="currentColor" stroke="none" font-size="10" text-anchor="start">DIN 5-pin / Rear</text>
<text x="968" y="156" fill="currentColor" stroke="none" font-size="8" text-anchor="end">&gt; OUT</text>
</g>
<rect x="1015" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1033" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">DATA / POWER / CONTROLS</text>
<g id="arturia-minilab-3-connections--port-2-1" aria-label="USB-C" data-direction="bidirectional"><title>USB-C</title>
<rect x="1031" y="145" width="30" height="20" rx="3" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1077" y="156" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">USB-C</text>
<text x="1077" y="177" fill="currentColor" stroke="none" font-size="10" text-anchor="start">USB / Rear</text>
<text x="1463" y="156" fill="currentColor" stroke="none" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<text x="25" y="388" fill="currentColor" stroke="none" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="412" fill="currentColor" stroke="none" font-size="11" text-anchor="start">PERFORMANCE: Shift, Hold, Octave -, Octave +, Pitch, Mod</text>
<text x="25" y="430" fill="currentColor" stroke="none" font-size="11" text-anchor="start">DISPLAY: Display, Main encoder</text>
<text x="25" y="448" fill="currentColor" stroke="none" font-size="11" text-anchor="start">ENCODERS: Encoder 1, Encoder 2, Encoder 3, Encoder 4, Encoder 5, Encoder 6, Encoder 7, Encoder 8</text>
<text x="25" y="466" fill="currentColor" stroke="none" font-size="11" text-anchor="start">FADERS: Fader 1, Fader 2, Fader 3, Fader 4</text>
<text x="25" y="484" fill="currentColor" stroke="none" font-size="11" text-anchor="start">PADS: Pad 1, Pad 2, Pad 3, Pad 4, Pad 5, Pad 6, Pad 7, Pad 8</text>
</svg>
