<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 506" role="group" aria-labelledby="roli-piano-connections--title" aria-describedby="roli-piano-connections--description" data-device="roli-piano" data-diagram-style="wireframe" style="background: #fff; color: #000;">
<title id="roli-piano-connections--title">ROLI Piano connections</title><desc id="roli-piano-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}[data-part]:focus-visible{outline:3px solid currentColor}</style>
<text x="30" y="37" fill="currentColor" stroke="none" font-size="20" text-anchor="start" font-weight="bold">ROLI Piano / CONNECTIONS</text>
<text x="30" y="63" fill="currentColor" stroke="none" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
<rect x="25" y="90" width="470" height="308" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="43" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">INPUTS</text>
<g id="roli-piano-connections--port-0-1" aria-label="Sustain / Expression" data-direction="input"><title>Sustain / Expression</title>
<circle cx="56" cy="155" r="11" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="56" cy="155" r="4" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="87" y="156" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">Sustain / Expression</text>
<text x="87" y="177" fill="currentColor" stroke="none" font-size="10" text-anchor="start">3.5 mm TRS (supplied pedal adapter) / Rear</text>
<text x="473" y="156" fill="currentColor" stroke="none" font-size="8" text-anchor="end">IN &gt;</text>
</g>
<rect x="520" y="90" width="470" height="308" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="538" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">OUTPUTS</text>
<g id="roli-piano-connections--port-1-1" aria-label="MIDI OUT" data-direction="output"><title>MIDI OUT</title>
<circle cx="551" cy="155" r="11" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="551" cy="155" r="4" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="582" y="156" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">MIDI OUT</text>
<text x="582" y="177" fill="currentColor" stroke="none" font-size="10" text-anchor="start">3.5 mm TRS / Rear</text>
<text x="968" y="156" fill="currentColor" stroke="none" font-size="8" text-anchor="end">&gt; OUT</text>
</g>
<rect x="1015" y="90" width="470" height="308" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1033" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">DATA / POWER / CONTROLS</text>
<g id="roli-piano-connections--port-2-1" aria-label="USB port 1" data-direction="bidirectional"><title>USB port 1</title>
<rect x="1031" y="145" width="30" height="20" rx="3" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1077" y="156" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">USB port 1</text>
<text x="1077" y="177" fill="currentColor" stroke="none" font-size="10" text-anchor="start">USB-C MIDI / power / Rear</text>
<text x="1463" y="156" fill="currentColor" stroke="none" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<g id="roli-piano-connections--port-2-2" aria-label="USB port 2" data-direction="bidirectional"><title>USB port 2</title>
<rect x="1031" y="207" width="30" height="20" rx="3" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1077" y="218" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">USB port 2</text>
<text x="1077" y="239" fill="currentColor" stroke="none" font-size="10" text-anchor="start">USB-C MIDI / power / Rear</text>
<text x="1463" y="218" fill="currentColor" stroke="none" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<g id="roli-piano-connections--port-2-3" aria-label="USB port 3" data-direction="bidirectional"><title>USB port 3</title>
<rect x="1031" y="269" width="30" height="20" rx="3" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1077" y="280" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">USB port 3</text>
<text x="1077" y="301" fill="currentColor" stroke="none" font-size="10" text-anchor="start">USB-C MIDI / power / Rear</text>
<text x="1463" y="280" fill="currentColor" stroke="none" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<g id="roli-piano-connections--port-2-4" aria-label="Bluetooth MIDI" data-direction="bidirectional"><title>Bluetooth MIDI</title>
<circle cx="1046" cy="341" r="11" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="1046" cy="341" r="4" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1077" y="342" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">Bluetooth MIDI</text>
<text x="1077" y="363" fill="currentColor" stroke="none" font-size="10" text-anchor="start">Wireless / Wireless</text>
<text x="1463" y="342" fill="currentColor" stroke="none" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<text x="25" y="436" fill="currentColor" stroke="none" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="460" fill="currentColor" stroke="none" font-size="11" text-anchor="start">POWER / MIDI MODE / BLUETOOTH / OCTAVE: Power / Mode, Bluetooth, Octave -, Octave +</text>
</svg>
