<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 542" role="img" aria-labelledby="title description">
<title id="title">ROLI Seaboard RISE 49 connections</title><desc id="description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<metadata>Symbol vocabulary: NYU ABILITY Project / IDM SynthAccess; https://github.com/IDMNYU/synthaccess/tree/ee1ef12cec3a3fb6be59a7861f7df8848be2dafe/tactileSynthGuides. Original schematic geometry; physical controls do not imply MIDI mappings.</metadata>
<defs>
<pattern id="tactile-stripes" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 3H6" stroke="#000" stroke-width="2"/></pattern>
<pattern id="tactile-dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><circle cx="2" cy="2" r="1.5" fill="#000"/><circle cx="6" cy="6" r="1.5" fill="#000"/></pattern>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#000;stroke:none}.line{fill:#fff;stroke:#000;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.thin{fill:none;stroke:#000;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="1500" height="542" fill="#fff" stroke="none" stroke-width="1.6"/>
<text x="30" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="start" font-weight="bold">ROLI Seaboard RISE 49 / CONNECTIONS</text>
<text x="30" y="63" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
<rect x="25" y="90" width="470" height="308" fill="#fff" stroke="#000" stroke-width="1.6" rx="6"/>
<text x="43" y="116" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">INPUTS</text>
<g id="port-0-1" aria-label="Pedal" data-direction="input"><title>Pedal</title>
<svg data-symbol="input" x="39.000" y="142.000" width="34.000" height="34.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#fff"/></g></svg>
<text x="87" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">Pedal</text>
<text x="87" y="177" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">6.35 mm pedal / Rear</text>
<text x="473" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">IN &gt;</text>
</g>
<g id="port-0-2" aria-label="DC IN" data-direction="input"><title>DC IN</title>
<svg data-symbol="input" x="39.000" y="204.000" width="34.000" height="34.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#fff"/></g></svg>
<text x="87" y="218" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">DC IN</text>
<text x="87" y="239" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">Power / Left</text>
<text x="473" y="218" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">IN &gt;</text>
</g>
<rect x="520" y="90" width="470" height="308" fill="#fff" stroke="#000" stroke-width="1.6" rx="6"/>
<text x="538" y="116" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">OUTPUTS</text>
<text x="538" y="155" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start">No connections in this category</text>
<rect x="1015" y="90" width="470" height="308" fill="#fff" stroke="#000" stroke-width="1.6" rx="6"/>
<text x="1033" y="116" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">DATA / POWER / CONTROLS</text>
<g id="port-2-1" aria-label="USB-B" data-direction="bidirectional"><title>USB-B</title>
<svg data-symbol="bidirectional" x="1029.000" y="142.000" width="34.000" height="34.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="34" height="34" fill="url(#tactile-dots)"/></g></svg>
<text x="1077" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">USB-B</text>
<text x="1077" y="177" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">USB / Rear</text>
<text x="1463" y="156" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<g id="port-2-2" aria-label="USB-A" data-direction="bidirectional"><title>USB-A</title>
<svg data-symbol="bidirectional" x="1029.000" y="204.000" width="34.000" height="34.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="34" height="34" fill="url(#tactile-dots)"/></g></svg>
<text x="1077" y="218" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">USB-A</text>
<text x="1077" y="239" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">USB host / Left</text>
<text x="1463" y="218" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<g id="port-2-3" aria-label="Bluetooth MIDI" data-direction="bidirectional"><title>Bluetooth MIDI</title>
<svg data-symbol="bidirectional" x="1029.000" y="266.000" width="34.000" height="34.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="34" height="34" fill="url(#tactile-dots)"/></g></svg>
<text x="1077" y="280" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">Bluetooth MIDI</text>
<text x="1077" y="301" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">Wireless / Wireless</text>
<text x="1463" y="280" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">&lt; &gt;</text>
</g>
<g id="port-2-4" aria-label="Power on/off" data-direction="control"><title>Power on/off</title>
<svg data-symbol="input" x="1029.000" y="328.000" width="34.000" height="34.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#fff"/></g></svg>
<text x="1077" y="342" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">Power on/off</text>
<text x="1077" y="363" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="start">Switch / Rear</text>
<text x="1463" y="342" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="8" text-anchor="end">CONTROL</text>
</g>
<text x="25" y="436" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="460" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">TOUCH FADERS: Glide, Slide, Press</text>
<text x="25" y="478" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">XY TOUCHPAD: XY</text>
<text x="25" y="496" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">OCTAVE / POWER: Octave -, Octave +, Power / Mode</text>
</svg>
