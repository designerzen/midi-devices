<title id="roli-piano-m-panel--title">ROLI Piano M / LUMI Keys overhead hardware diagram</title><desc id="roli-piano-m-panel--description">Original simplified top-down line drawing; positions are illustrative, not mechanical dimensions. Each physical control has a stable device-prefixed ID and data-part name; standalone buttons are disabled until a host adds input handlers. Transparent regions marked data-surface-control are the profile&#x27;s MIDI hit areas, and several can share one context-dependent control.</desc>
