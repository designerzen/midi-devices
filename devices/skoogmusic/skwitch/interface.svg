<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="title description">
<title id="title">Skoogmusic Skwitch labelled interface</title><desc id="description">Original simplified component schematic. Components and playing surfaces are separated for clarity; this is not a scale hardware drawing. Musical assignments depend on the device setup or companion app.</desc>
<metadata>Symbol vocabulary: NYU ABILITY Project / IDM SynthAccess; https://github.com/IDMNYU/synthaccess/tree/ee1ef12cec3a3fb6be59a7861f7df8848be2dafe/tactileSynthGuides. Original schematic geometry; physical controls do not imply MIDI mappings.</metadata>
<defs>
<pattern id="tactile-stripes" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 3H6" stroke="#000" stroke-width="2"/></pattern>
<pattern id="tactile-dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><circle cx="2" cy="2" r="1.5" fill="#000"/><circle cx="6" cy="6" r="1.5" fill="#000"/></pattern>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#000;stroke:none}.line{fill:#fff;stroke:#000;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.thin{fill:none;stroke:#000;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="700" height="460" fill="#fff" stroke="none" stroke-width="1.6"/>
<rect x="9" y="9" width="682" height="442" fill="#fff" stroke="#000" stroke-width="1.6" rx="12"/>
<text x="25" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="bold">Skoogmusic Skwitch</text>
<text x="675" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="end">COMPONENT VIEW</text>
<rect x="45" y="75" width="350" height="350" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
<text x="52" y="89" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="9" text-anchor="start" font-weight="bold">PLAYING SURFACE</text>
<g id="playing-surface-pressure-button" data-kind="touch" aria-label="Pressure button"><title>Pressure button</title>
<circle cx="220" cy="254.785" r="25" fill="#fff" stroke="#000" stroke-width="1.6"/>
<path d="M220 232.785L220 246.035" fill="none" stroke="#000" stroke-width="1"/>
<circle cx="220" cy="254.785" r="20" fill="#fff" stroke="#000" stroke-width="1.6"/>
<text x="220" y="416" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle">Pressure button</text>
</g>
<rect x="415" y="75" width="240" height="350" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
<text x="422" y="89" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="9" text-anchor="start" font-weight="bold">PHONE / APP</text>
<g id="phone-app-companion-app-display" data-kind="screen" aria-label="Companion app display"><title>Companion app display</title>
<rect x="426" y="110" width="218" height="289.57" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
<rect x="430" y="114" width="210" height="281.57" fill="#fff" stroke="#000" stroke-width="1.6" rx="1"/>
<text x="535" y="416" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle">Companion app display</text>
</g>
</svg>
