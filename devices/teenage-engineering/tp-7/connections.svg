<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 524" role="img" aria-labelledby="title description">
<title id="title">Teenage Engineering TP-7 connections</title><desc id="description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<metadata>Symbol vocabulary: NYU ABILITY Project / IDM SynthAccess; https://github.com/IDMNYU/synthaccess/tree/ee1ef12cec3a3fb6be59a7861f7df8848be2dafe/tactileSynthGuides. Original schematic geometry; physical controls do not imply MIDI mappings.</metadata>
<defs>
<pattern id="tactile-stripes" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 3H6" stroke="#000" stroke-width="2"/></pattern>
<pattern id="tactile-dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><circle cx="2" cy="2" r="1.5" fill="#000"/><circle cx="6" cy="6" r="1.5" fill="#000"/></pattern>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#000;stroke:none}.line{fill:#fff;stroke:#000;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.thin{fill:none;stroke:#000;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="1500" height="524" fill="#fff" stroke="none" stroke-width="1.6"/>
<text x="30" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="start" font-weight="bold">Teenage Engineering TP-7 / CONNECTIONS</text>
<text x="30" y="63" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
<rect x="25" y="90" width="470" height="308" fill="#fff" stroke="#000" stroke-width="1.6" rx="6"/>
<text x="43" y="116" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="start" font-weight="bold">INPUTS</text>
<text x="43" y="155" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start">No connections in this category</text>
