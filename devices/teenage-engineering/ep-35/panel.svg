<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title description">
<title id="title">Teenage Engineering EP-35 K.O.amp top panel</title><desc id="description">Original simplified top-down line drawing; positions are illustrative, not mechanical dimensions. Labels identify physical controls, not guaranteed MIDI assignments.</desc>
<metadata>Symbol vocabulary: NYU ABILITY Project / IDM SynthAccess; https://github.com/IDMNYU/synthaccess/tree/ee1ef12cec3a3fb6be59a7861f7df8848be2dafe/tactileSynthGuides. Original schematic geometry; physical controls do not imply MIDI mappings.</metadata>
<defs>
<pattern id="tactile-stripes" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 3H6" stroke="#000" stroke-width="2"/></pattern>
<pattern id="tactile-dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><circle cx="2" cy="2" r="1.5" fill="#000"/><circle cx="6" cy="6" r="1.5" fill="#000"/></pattern>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#000;stroke:none}.line{fill:#fff;stroke:#000;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.thin{fill:none;stroke:#000;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="1000" height="650" fill="#fff" stroke="none" stroke-width="1.6"/>
<rect x="9" y="9" width="982" height="632" fill="#fff" stroke="#000" stroke-width="1.6" rx="12"/>
<text x="25" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="bold">Teenage Engineering EP-35 K.O.amp</text>
<text x="975" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="end">TOP VIEW</text>
<rect x="25" y="65" width="950" height="510" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
<g id="top-controls-power" data-kind="button" aria-label="Power"><title>Power</title>
<svg data-symbol="power" x="124.250" y="181.035" width="48.000" height="48.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><circle cx="20" cy="20" r="18" fill="#fff"/><circle cx="20" cy="20" r="14" fill="#fff"/><path d="M6 20A14 14 0 0 1 34 20Z" fill="#000"/></g></svg>
</g>
<g id="top-controls-volume" data-kind="knob" aria-label="Volume"><title>Volume</title>
<svg data-symbol="knob" x="358.750" y="181.035" width="48.000" height="48.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><circle cx="20" cy="20" r="18" fill="url(#tactile-stripes)"/><circle cx="20" cy="20" r="11" fill="#fff"/></g></svg>
</g>
<g id="top-controls-guitar-fx" data-kind="knob" aria-label="Guitar FX"><title>Guitar FX</title>
<svg data-symbol="knob" x="593.250" y="181.035" width="48.000" height="48.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><circle cx="20" cy="20" r="18" fill="url(#tactile-stripes)"/><circle cx="20" cy="20" r="11" fill="#fff"/></g></svg>
</g>
<g id="top-controls-guitar-fx-amount" data-kind="knob" aria-label="Guitar FX amount"><title>Guitar FX amount</title>
<svg data-symbol="knob" x="827.750" y="181.035" width="48.000" height="48.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><circle cx="20" cy="20" r="18" fill="url(#tactile-stripes)"/><circle cx="20" cy="20" r="11" fill="#fff"/></g></svg>
</g>
<g id="top-controls-mic-fx" data-kind="knob" aria-label="Mic FX"><title>Mic FX</title>
<svg data-symbol="knob" x="124.250" y="418.535" width="48.000" height="48.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><circle cx="20" cy="20" r="18" fill="url(#tactile-stripes)"/><circle cx="20" cy="20" r="11" fill="#fff"/></g></svg>
</g>
<g id="top-controls-mic-fx-amount" data-kind="knob" aria-label="Mic FX amount"><title>Mic FX amount</title>
<svg data-symbol="knob" x="358.750" y="418.535" width="48.000" height="48.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><circle cx="20" cy="20" r="18" fill="url(#tactile-stripes)"/><circle cx="20" cy="20" r="11" fill="#fff"/></g></svg>
</g>
<g id="top-controls-mode" data-kind="button" aria-label="Mode"><title>Mode</title>
<svg data-symbol="button" x="593.250" y="418.535" width="48.000" height="48.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="34" height="34" fill="#fff"/><path d="M3 3L10 10M37 3L30 10M3 37L10 30M37 37L30 30"/><rect x="10" y="10" width="20" height="20" fill="#000"/></g></svg>
</g>
</svg>
