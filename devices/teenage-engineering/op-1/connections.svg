<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 530" role="group" aria-labelledby="teenage-engineering-op-1-connections--title" aria-describedby="teenage-engineering-op-1-connections--description" data-device="teenage-engineering-op-1" data-diagram-style="wireframe" style="background: #fff; color: #000;">
<title id="teenage-engineering-op-1-connections--title">Teenage Engineering OP-1 connections</title><desc id="teenage-engineering-op-1-connections--description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}[data-part]:focus-visible{outline:3px solid currentColor}</style>
<text x="30" y="37" fill="currentColor" stroke="none" font-size="20" text-anchor="start" font-weight="bold">Teenage Engineering OP-1 / CONNECTIONS</text>
<text x="30" y="63" fill="currentColor" stroke="none" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
<rect x="25" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="43" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">INPUTS</text>
<g id="teenage-engineering-op-1-connections--port-0-1" aria-label="Line IN" data-direction="input"><title>Line IN</title>
<circle cx="56" cy="155" r="11" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="56" cy="155" r="4" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="87" y="156" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">Line IN</text>
<text x="87" y="177" fill="currentColor" stroke="none" font-size="10" text-anchor="start">3.5 mm / Right</text>
<text x="473" y="156" fill="currentColor" stroke="none" font-size="8" text-anchor="end">IN &gt;</text>
</g>
<g id="teenage-engineering-op-1-connections--port-0-2" aria-label="Microphone" data-direction="input"><title>Microphone</title>
<circle cx="56" cy="217" r="11" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="56" cy="217" r="4" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="87" y="218" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">Microphone</text>
<text x="87" y="239" fill="currentColor" stroke="none" font-size="10" text-anchor="start">Built-in / Top</text>
<text x="473" y="218" fill="currentColor" stroke="none" font-size="8" text-anchor="end">IN &gt;</text>
</g>
<rect x="520" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="538" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">OUTPUTS</text>
<g id="teenage-engineering-op-1-connections--port-1-1" aria-label="Line OUT / phones" data-direction="output"><title>Line OUT / phones</title>
<circle cx="551" cy="155" r="11" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<circle cx="551" cy="155" r="4" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="582" y="156" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">Line OUT / phones</text>
<text x="582" y="177" fill="currentColor" stroke="none" font-size="10" text-anchor="start">3.5 mm / Right</text>
<text x="968" y="156" fill="currentColor" stroke="none" font-size="8" text-anchor="end">&gt; OUT</text>
</g>
<rect x="1015" y="90" width="470" height="260" rx="6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6"/>
<text x="1033" y="116" fill="currentColor" stroke="none" font-size="13" text-anchor="start" font-weight="bold">DATA / POWER / CONTROLS</text>
