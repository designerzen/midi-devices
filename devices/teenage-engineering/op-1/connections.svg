<text x="1077" y="239" fill="currentColor" stroke="none" font-size="10" text-anchor="start">Switch / Right</text>
<text x="1463" y="218" fill="currentColor" stroke="none" font-size="8" text-anchor="end">CONTROL</text>
</g>
<text x="25" y="388" fill="currentColor" stroke="none" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="412" fill="currentColor" stroke="none" font-size="11" text-anchor="start">SPEAKER: Speaker, Volume</text>
<text x="25" y="430" fill="currentColor" stroke="none" font-size="11" text-anchor="start">MODES: Synth, Drum, Tape, Mixer, Tempo, Help, Shift, COM</text>
<text x="25" y="448" fill="currentColor" stroke="none" font-size="11" text-anchor="start">DISPLAY: Display, T1, T2, T3, T4</text>
<text x="25" y="466" fill="currentColor" stroke="none" font-size="11" text-anchor="start">ENCODERS / TAPE: Blue encoder, Green encoder, White encoder, Orange encoder</text>
<text x="25" y="484" fill="currentColor" stroke="none" font-size="11" text-anchor="start">TAPE TRANSPORT: Rec, Play, Stop, Lift, Drop</text>
</svg>
