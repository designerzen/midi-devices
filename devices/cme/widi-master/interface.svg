<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title description">
<title id="title">CME WIDI Master labelled interface</title><desc id="description">Original schematic of selected physical controls and connectors. Grouped positions are illustrative; consult manufacturer documentation for socket placement and complete controls.</desc>
<metadata>Symbol vocabulary: NYU ABILITY Project / IDM SynthAccess; https://github.com/IDMNYU/synthaccess/tree/ee1ef12cec3a3fb6be59a7861f7df8848be2dafe/tactileSynthGuides. Original schematic geometry; physical controls do not imply MIDI mappings.</metadata>
<defs>
<pattern id="tactile-stripes" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 3H6" stroke="#000" stroke-width="2"/></pattern>
<pattern id="tactile-dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><circle cx="2" cy="2" r="1.5" fill="#000"/><circle cx="6" cy="6" r="1.5" fill="#000"/></pattern>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#000;stroke:none}.line{fill:#fff;stroke:#000;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.thin{fill:none;stroke:#000;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="900" height="250" fill="#fff" stroke="none" stroke-width="1.6"/>
<rect x="9" y="9" width="882" height="232" fill="#fff" stroke="#000" stroke-width="1.6" rx="12"/>
<text x="25" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="bold">CME WIDI Master</text>
<text x="875" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="end">INTERFACE</text>
<rect x="25" y="65" width="850" height="150" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
<text x="32" y="79" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="9" text-anchor="start" font-weight="bold">CONNECTIONS</text>
<g id="connections-midi-in" data-kind="input" aria-label="MIDI IN"><title>MIDI IN</title>
<svg data-symbol="input" x="146.667" y="119.785" width="48.000" height="48.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#fff"/></g></svg>
<text x="170.667" y="206" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle">MIDI IN</text>
</g>
<g id="connections-midi-out-power" data-kind="output" aria-label="MIDI OUT / power"><title>MIDI OUT / power</title>
<svg data-symbol="output" x="426.000" y="119.785" width="48.000" height="48.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="url(#tactile-stripes)"/></g></svg>
<text x="450" y="206" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle">MIDI OUT / power</text>
</g>
<g id="connections-bluetooth-midi" data-kind="bidirectional" aria-label="Bluetooth MIDI"><title>Bluetooth MIDI</title>
<svg data-symbol="bidirectional" x="705.333" y="119.785" width="48.000" height="48.000" viewBox="0 0 40 40"><g fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="34" height="34" fill="url(#tactile-dots)"/></g></svg>
<text x="729.333" y="206" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle">Bluetooth MIDI</text>
</g>
</svg>
