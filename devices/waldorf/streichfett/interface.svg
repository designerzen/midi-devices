<title id="title">Waldorf Streichfett labelled interface</title><desc id="description">Original schematic of selected physical controls. Positions are illustrative, not scaled hardware dimensions; consult the manufacturer reference for the complete panel. Controls are unbound because their behavior depends on mode, preset or configuration.</desc>
<metadata>Symbol vocabulary: NYU ABILITY Project / IDM SynthAccess; https://github.com/IDMNYU/synthaccess/tree/ee1ef12cec3a3fb6be59a7861f7df8848be2dafe/tactileSynthGuides. Original schematic geometry; physical controls do not imply MIDI mappings.</metadata>
