<text x="25" y="560" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start" font-weight="bold">PHYSICAL CONTROLS / see interface.svg for labelled positions</text>
<text x="25" y="584" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Tune / Power: Power, Tune</text>
<text x="25" y="602" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Modulator: LFO/CLK Rate, Waveform</text>
<text x="25" y="620" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">VCO: Mod, Range, Pulse Width, PWM LFO / Manual / ENV</text>
<text x="25" y="638" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Source mixer: Pulse, Saw, Sub Osc, Sub type, Noise</text>
<text x="25" y="656" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">VCF: Frequency, Resonance, ENV, Mod, Keyboard</text>
<text x="25" y="674" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">VCA: ENV / Gate</text>
<text x="25" y="692" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Envelope: Gate+Trig / Gate / LFO, Attack, Decay, Sustain, Release</text>
<text x="25" y="710" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Volume / Portamento: Volume, Portamento</text>
<text x="25" y="728" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Bender: VCO depth, VCF depth, Joystick</text>
<text x="25" y="746" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Performance: Portamento Auto / Off / On, Transpose L / M / H, LFO Mod</text>
<text x="25" y="764" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="start">Sequencer / Arpeggiator: Load / Rec, Play / Reset, Down, U+D, Up, Hold / Chord / Legato, Transpose / Latch / Rest, Internal / Write A, External / Write B, Jump, Chain, Batt / Bank Select, Shift</text>
