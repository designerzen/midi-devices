<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
<title id="title">Yamaha reface CP top panel</title><desc id="description">Original schematic of selected controls, grouped by function. Positions are illustrative, not scaled hardware dimensions; connections.svg is a separate socket inventory. No MIDI assignments are implied.</desc>
<metadata>Symbol vocabulary: NYU ABILITY Project / IDM SynthAccess; https://github.com/IDMNYU/synthaccess/tree/ee1ef12cec3a3fb6be59a7861f7df8848be2dafe/tactileSynthGuides. Original schematic geometry; physical controls do not imply MIDI mappings.</metadata>
