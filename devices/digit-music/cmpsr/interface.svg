<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 1040" role="group" aria-labelledby="digit-cmpsr-interface--title" aria-describedby="digit-cmpsr-interface--description" data-device="digit-cmpsr" data-diagram-style="wireframe" style="background: #fff; color: #000;">
<title id="digit-cmpsr-interface--title">DIGIT CMPSR labelled interface</title><desc id="digit-cmpsr-interface--description">Original simplified top-down line drawing; positions are illustrative, not mechanical dimensions. Each physical control has a stable device-prefixed ID and data-part name; standalone buttons are disabled until a host adds input handlers. Transparent regions marked data-surface-control are the profile&#x27;s MIDI hit areas, and several can share one context-dependent control.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}[data-part]:focus-visible{outline:3px solid currentColor}</style>
