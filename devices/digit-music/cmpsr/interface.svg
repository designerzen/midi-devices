<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 1040" role="img" aria-labelledby="title description">
<title id="title">DIGIT CMPSR labelled interface</title><desc id="description">Original simplified top-down line drawing; positions are illustrative, not mechanical dimensions. Labels identify physical controls, not guaranteed MIDI assignments.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#000;stroke:none}.line{fill:#fff;stroke:#000;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.thin{fill:none;stroke:#000;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="530" height="1040" class="line" fill="#fff" stroke="none" stroke-width="1.6"/>
<path d="M80 9H450Q520 9 515 90L470 970Q465 1031 410 1031H120Q65 1031 60 970L15 90Q10 9 80 9Z" fill="#fff" stroke="#000" stroke-width="2"/>
