<text x="505" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="end">INTERFACE</text>
<rect x="85" y="85" width="360" height="310" class="line" fill="#fff" stroke="#000" stroke-width="1.6" rx="3"/>
<text x="92" y="99" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="9" text-anchor="start" font-weight="bold">JOYSTICK</text>
