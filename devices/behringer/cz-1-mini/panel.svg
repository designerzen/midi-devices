<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title description">
<title id="title">Behringer CZ-1 MINI top panel</title><desc id="description">Partial grouped physical-control inventory. Positions are schematic, not a hardware placement drawing. Touch-key notes are virtual defaults. Deep MIDI parameters are available separately in the controls list.</desc>
<metadata>Symbol vocabulary: NYU ABILITY Project / IDM SynthAccess; https://github.com/IDMNYU/synthaccess/tree/ee1ef12cec3a3fb6be59a7861f7df8848be2dafe/tactileSynthGuides. Original schematic geometry; physical controls do not imply MIDI mappings.</metadata>
