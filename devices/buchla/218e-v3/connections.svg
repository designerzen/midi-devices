<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 666" role="img" aria-labelledby="title description">
<title id="title">Buchla 218e V3 connections</title><desc id="description">Connection inventory. Arrows indicate signal direction relative to the instrument. Locations identify hardware faces; the diagram is not a socket placement drawing. Physical control sections are listed below.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#000;stroke:none}.line{fill:#fff;stroke:#000;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.thin{fill:none;stroke:#000;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="1500" height="666" class="line" fill="#fff" stroke="none" stroke-width="1.6"/>
<text x="30" y="37" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="start" font-weight="bold">Buchla 218e V3 / CONNECTIONS</text>
<text x="30" y="63" fill="#000" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start">Arrows are relative to the device. Locations name the hardware face; sockets are grouped by function.</text>
